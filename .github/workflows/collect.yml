# The data update for guildmarch.com, run from the public collector repo, where standard runners
# don't count against Actions minutes (a run takes about 4 hours, paced by Blizzard's hourly limit).
# Collect every registered guild, score, export, build and deploy to Cloudflare Pages, then keep an
# encrypted DB dump for 30 days. Started Monday and Thursday 08:00 KST by the Cloudflare Worker in
# workers/daily-trigger of the private repo, or by hand from the Actions tab.
# Copied from collector/collect.yml in the private repo by collector/sync.sh; edit it there.
# Needs repository secrets DATABASE_URL (Supabase session pooler), BLIZZARD_CLIENT_ID,
# BLIZZARD_CLIENT_SECRET, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DUMP_PASSPHRASE.
name: Collect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    # 350 leaves room for the build and stays under GitHub's 360-minute ceiling
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and check in Docker
        uses: docker/build-push-action@v6
        with:
          context: web
          target: deploy
          load: true
          tags: guild-weekly-site
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Collect, score, build and deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'guildmarch' }}
          PAGES_BRANCH: main
          PIPELINE: daily
        run: >-
          docker run --rm -e DATABASE_URL -e BLIZZARD_CLIENT_ID -e BLIZZARD_CLIENT_SECRET
          -e CLOUDFLARE_API_TOKEN -e CLOUDFLARE_ACCOUNT_ID -e PAGES_PROJECT -e PAGES_BRANCH -e PIPELINE
          guild-weekly-site

      # Even after a failed update, so the data as it stood is kept. The dump holds character data and
      # this repo is public (anyone signed in to GitHub can download its artifacts), so it is encrypted
      # before upload. 30 days: the API terms say character data must go within 30 days of a removal
      # request. To restore:
      #   openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in db.dump.enc -out db.dump   (asks for the passphrase)
      - name: Dump and encrypt the database
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DUMP_PASSPHRASE: ${{ secrets.DUMP_PASSPHRASE }}
        run: |
          test -n "$DUMP_PASSPHRASE" || { echo "::error::DUMP_PASSPHRASE is not set; no dump kept"; exit 1; }
          set -o pipefail
          docker run --rm -e DATABASE_URL postgres:17 sh -c 'pg_dump --schema=public --no-owner --no-privileges -Fc "$DATABASE_URL"' \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:DUMP_PASSPHRASE -out db.dump.enc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: db-${{ github.run_id }}
          path: db.dump.enc
          retention-days: 30
          if-no-files-found: error
